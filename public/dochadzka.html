<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dochádzka — nová adresa</title>
<link rel="canonical" href="https://michalko999.github.io/dochadzka/">
<script>
  // Prenesieme aj parametre, aby fungoval napr. ?view=public
  var target = 'https://michalko999.github.io/dochadzka/' + location.search + location.hash;
  location.replace(target);
</script>
<!-- Záloha pre prehliadač s vypnutým JavaScriptom -->
<meta http-equiv="refresh" content="2; url=https://michalko999.github.io/dochadzka/">
<style>
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f8fafc; color: #0f172a;
         min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 28px 32px;
          box-shadow: 0 4px 6px rgba(0,0,0,.05); max-width: 460px; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0 0 10px; }
  p { font-size: .9rem; line-height: 1.6; color: #475569; margin: 0 0 8px; }
  a { color: #2563eb; font-weight: 600; word-break: break-all; }
  .hint { font-size: .8rem; color: #94a3b8; margin-top: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Dochádzka sa presťahovala</h1>
    <p>Presmerúvam ťa na novú adresu:<br>
      <a id="link" href="https://michalko999.github.io/dochadzka/">michalko999.github.io/dochadzka/</a></p>
    <p class="hint">Ulož si ju do záložiek — prihlasovanie aj všetky dáta ostávajú rovnaké.</p>
  </div>
  <script>
    document.getElementById('link').href = target;
  </script>
</body>
</html>
